name: Offline focused correctness

# Iteration checks only. Full candidate and genuine-wallet acceptance remain
# separate milestones; this job cannot set PRODUCT_READY or close B1/B2/B3.
on:
  push:
    branches: [codex/product-completion]
  pull_request:
    branches: [codex/product-completion]

permissions:
  contents: read

concurrency:
  group: offline-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Registry downloads happen before the isolated test phase. No provider
      # key, repository secret, credential cache or application data is loaded.
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./setup.sh --skip-frontend
          npm ci --prefix frontend --no-audit --no-fund --ignore-scripts

      # A fresh Linux network namespace has no routed interface. Drop root
      # before running project code, so checks cannot call live providers even
      # if an offline test accidentally stops mocking a request.
      - name: Run focused checks without network access
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env PATH="$PATH" CI_EVIDENCE="$RUNNER_TEMP/offline-focused" \
            bash --noprofile --norc -euo pipefail <<'CHECKS'
          test -z "${HELIUS_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          .venv/bin/python -m pip check
          bash -n run.sh setup.sh
          .venv/bin/python tools/validate.py --profile focused --output "$CI_EVIDENCE/focused"
          .venv/bin/python tools/check_product.py --output "$CI_EVIDENCE/product"
          .venv/bin/python - "$CI_EVIDENCE" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          focused = json.loads((root / 'focused/result.json').read_text())
          product = json.loads((root / 'product/result.json').read_text())
          assert focused['state'] == 'FOCUSED_PASS' and focused['source_unchanged'] is True
          assert product['state'] == 'DEVELOPMENT_PASS'
          assert product['development']['state'] == 'PASS'
          assert product['provider_requests'] == product['credential_lookups'] == 0
          assert product['parent_unchanged'] is True
          assert product['real_acceptance']['state'] == 'BLOCKED'
          print('Offline development checks passed; genuine acceptance remains BLOCKED.')
          PY
          npm --prefix frontend run check:format
          npm --prefix frontend run check:discovery
          npm --prefix frontend run build
          git diff --exit-code
          CHECKS

      # Keep only assertion output in the native job log. Do not upload the
      # disposable application databases, reports, runtime files or archives.
      - name: Report scope
        if: success()
        shell: bash
        run: |
          echo 'Offline focused correctness passed. This is iteration evidence only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'B1/B2/B3 and PRODUCT_READY remain governed by the milestone evidence.' >> "$GITHUB_STEP_SUMMARY"
