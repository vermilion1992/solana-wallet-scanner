name: Offline focused correctness

# Iteration checks only. Six disjoint batches retain the original 30 selectors
# and add five regression modules. Full candidate and real acceptance are separate.
on:
  push:
    branches: [codex/product-completion]
  pull_request:
    branches: [codex/product-completion]

permissions:
  contents: read

concurrency:
  group: offline-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-group:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [historical, schemas, archives, indexed, research, discovery]
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Node for receipt binding
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked backend dependencies
        shell: bash
        run: ./setup.sh --skip-frontend
      # Download dependencies before isolation; never load provider/repository
      # credentials. The isolated namespace has no routed interface. Drop root.
      - name: Run the exact focused group without network access
        shell: bash
        env:
          CI_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          sudo unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env PATH="$PATH" CI_EVIDENCE="$RUNNER_TEMP/offline-focused" CI_GROUP="$CI_GROUP" \
            bash --noprofile --norc -euo pipefail <<'CHECKS'
          test -z "${HELIUS_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          .venv/bin/python tools/validate.py --profile focused --focused-group "$CI_GROUP" --output "$CI_EVIDENCE/$CI_GROUP"
          CHECKS
      - name: Preserve bounded diagnostics even after failure or interruption
        if: always()
        shell: bash
        env:
          CI_GROUP: ${{ matrix.group }}
        run: |
          python - "$RUNNER_TEMP/offline-focused/$CI_GROUP" "$RUNNER_TEMP/ci-diagnostics/$CI_GROUP" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          source, target = map(Path, sys.argv[1:]); target.mkdir(parents=True, exist_ok=True)
          records = []
          for name in ('result.json', 'runtime.log', 'node-runtime.log', 'backend.log'):
              path = source / name
              if not path.is_file() or path.is_symlink():
                  records.append({'name': name, 'state': 'MISSING'}); continue
              size = path.stat().st_size
              if size > 4 * 1024 * 1024:
                  records.append({'name': name, 'state': 'OMITTED_TRANSFER_BOUND', 'bytes': size}); continue
              raw = path.read_bytes(); (target / name).write_bytes(raw)
              records.append({'name': name, 'state': 'COPIED', 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          (target / 'DIAGNOSTIC_STATUS.json').write_text(json.dumps({'scope': 'Fixed validator text/JSON allowlist only; no application state.', 'records': records}, indent=2)+'\n')
          PY
      # Pins verified against the official actions repositories. Never upload
      # broad directories: source archives, private reports, sessions and DBs
      # are absent from this explicit artifact allowlist.
      - name: Upload only focused receipts and text logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: focused-${{ matrix.group }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ci-diagnostics/${{ matrix.group }}/result.json
            ${{ runner.temp }}/ci-diagnostics/${{ matrix.group }}/runtime.log
            ${{ runner.temp }}/ci-diagnostics/${{ matrix.group }}/node-runtime.log
            ${{ runner.temp }}/ci-diagnostics/${{ matrix.group }}/backend.log
            ${{ runner.temp }}/ci-diagnostics/${{ matrix.group }}/DIAGNOSTIC_STATUS.json

  offline-development:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./setup.sh --skip-frontend
          npm ci --prefix frontend --no-audit --no-fund --ignore-scripts
      - name: Run product and frontend checks without network access
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env PATH="$PATH" CI_EVIDENCE="$RUNNER_TEMP/offline-development" \
            bash --noprofile --norc -euo pipefail <<'CHECKS'
          test -z "${HELIUS_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          .venv/bin/python tools/validate.py --profile offline-development --output "$CI_EVIDENCE"
          git diff --exit-code
          CHECKS
      - name: Preserve bounded development diagnostics
        if: always()
        shell: bash
        run: |
          python - "$RUNNER_TEMP/offline-development" "$RUNNER_TEMP/ci-development-diagnostics" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          source, target = map(Path, sys.argv[1:]); target.mkdir(parents=True, exist_ok=True)
          names = ('result.json', 'runtime.log', 'node-runtime.log', 'pip-check.log', 'shell-syntax.log',
                   'product.log', 'frontend-check-format.log', 'frontend-check-discovery.log', 'frontend-build.log')
          records = []
          for name in names:
              path = source / name
              if not path.is_file() or path.is_symlink():
                  records.append({'name': name, 'state': 'MISSING'}); continue
              size = path.stat().st_size
              if size > 4 * 1024 * 1024:
                  records.append({'name': name, 'state': 'OMITTED_TRANSFER_BOUND', 'bytes': size}); continue
              raw = path.read_bytes(); (target / name).write_bytes(raw)
              records.append({'name': name, 'state': 'COPIED', 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          (target / 'DIAGNOSTIC_STATUS.json').write_text(json.dumps({'scope': 'No private-product result, archive, report or data directory is transferred.', 'records': records}, indent=2)+'\n')
          PY
      - name: Upload only development receipt and text logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-development-receipt
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ci-development-diagnostics/result.json
            ${{ runner.temp }}/ci-development-diagnostics/runtime.log
            ${{ runner.temp }}/ci-development-diagnostics/node-runtime.log
            ${{ runner.temp }}/ci-development-diagnostics/pip-check.log
            ${{ runner.temp }}/ci-development-diagnostics/shell-syntax.log
            ${{ runner.temp }}/ci-development-diagnostics/product.log
            ${{ runner.temp }}/ci-development-diagnostics/frontend-check-format.log
            ${{ runner.temp }}/ci-development-diagnostics/frontend-check-discovery.log
            ${{ runner.temp }}/ci-development-diagnostics/frontend-build.log
            ${{ runner.temp }}/ci-development-diagnostics/DIAGNOSTIC_STATUS.json

  focused-union:
    if: always()
    needs: [focused-group, offline-development]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked backend dependencies
        shell: bash
        run: ./setup.sh --skip-frontend
      - name: Download this run's receipts and allowlisted logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/focused-receipts
      - name: Require the exact complete passing focused union
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env PATH="$PATH" CI_RECEIPTS="$RUNNER_TEMP/focused-receipts" CI_SUMMARY="$RUNNER_TEMP/focused-summary" \
            bash --noprofile --norc -euo pipefail <<'CHECKS'
          test -z "${HELIUS_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          .venv/bin/python tools/validate.py --profile focused-summary --output "$CI_SUMMARY" \
            --group-record "$CI_RECEIPTS/focused-historical/result.json" \
            --group-record "$CI_RECEIPTS/focused-schemas/result.json" \
            --group-record "$CI_RECEIPTS/focused-archives/result.json" \
            --group-record "$CI_RECEIPTS/focused-indexed/result.json" \
            --group-record "$CI_RECEIPTS/focused-research/result.json" \
            --group-record "$CI_RECEIPTS/focused-discovery/result.json" \
            --development-record "$CI_RECEIPTS/offline-development-receipt/result.json"
          CHECKS
      - name: Report the verified iteration scope
        if: success()
        shell: bash
        run: |
          echo 'Exact disjoint focused union and offline development receipts passed, bound to this source, Git identity, locks and runtime.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is iteration evidence only. B1/B2/B3 and PRODUCT_READY remain governed by milestone evidence.' >> "$GITHUB_STEP_SUMMARY"
